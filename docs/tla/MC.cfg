\* TLC configuration for the Relais model (docs/tla/Relais.tla).
\*
\* Small constants on purpose: two machines, N = 2 ticks of will, p = 1 miss
\* tolerated, certification after one agreeing tick, three ticks deep.  This is
\* the same shape the exhaustive C explorer is run with (--faults 1, a bounded
\* depth), so the two paths cover the same kind of interleavings.
\*
\* Run it with:
\*   cd docs/tla
\*   java -XX:+UseParallelGC -cp <path>/tla2tools.jar tlc2.TLC \
\*        -config MC.cfg -metadir /tmp/relais-tlc Relais

SPECIFICATION Spec

CONSTANTS
  MaxTick      = 3
  MaxMandate   = 3
  N            = 2
  P            = 1
  CertifyTicks = 1

\* The type discipline is checked first: a model that leaves its own types is
\* not a model of anything.
INVARIANT TypeOK

\* The safety invariants of the specification (docs/SAFETY.md).
INVARIANT Inv_I1
INVARIANT Inv_I2
INVARIANT Inv_I3
INVARIANT Inv_I6
INVARIANT Inv_Safety
INVARIANT Inv_Lamp
