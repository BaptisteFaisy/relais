\* TLC model for ControlLaw.tla (M12).
\*
\* Fixed point, SC = 1000: a real value r is the integer r*SC. The constants
\* are the exact tuning of core/src/control.c and the bounds of ACT-05.
\*
\* The measurement grid is finite on purpose: CmdBounded and SlewBounded are
\* total properties of the two clamps, so they hold for every measurement,
\* and a representative grid is enough for TLC to confirm them. The closed
\* loop with its continuous state is verified by the C simulator and by the
\* exhaustive explorer instead.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC ControlLaw.tla

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CmdBounded
    SlewBounded
    IntegBounded

CONSTANTS
    MaxAmp      = 1000     \* max_amplitude 1.0
    MaxSlew     = 250      \* max_slew      0.25
    IntegLimit  = 250      \* CTL_INTEG_LIMIT 0.25
    RateLimit   = 20000    \* CTL_RATE_LIMIT  20.0
    FilterNum   = 35       \* CTL_FILTER 0.35 * 100
    DtNum       = 5        \* T = 5 ms
    DtDen       = 1000     \* fixed point scale
    RateGain    = 200      \* 1 / dt = 1 / 0.005
    Kp          = 60       \* CTL_KP
    KdNum       = 5        \* CTL_KD 0.5 numerator
    KdDen       = 10       \* CTL_KD 0.5 denominator
    Ki          = 4        \* CTL_KI

\* The measurement grid (PosSet, VelSet, SetpointSet) is defined inside the
\* module, in fixed point, so the model needs no set-valued constant here.
