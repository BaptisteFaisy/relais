name: qnx-demo-live

# Rejoue la démo « deux machines, QNX » sur un cycle régulier et publie un résumé
# JSON que la page publique relit en direct : ce que le site montre est donc le
# DERNIER passage réel, pas un enregistrement figé.
#
# Le JSON est publié sur une branche `live` ; la page le lit sur
# raw.githubusercontent.com. Aucun serveur n'est nécessaire : GitHub Pages est
# statique, et ce mode ne dépend que de ce que GitHub sait déjà servir.
#
# La branche `live` ne contient QUE ce fichier : c'est un artefact de publication,
# pas une branche de travail.

on:
  schedule:
    # chaque heure, à une heure ronde décalée pour ne pas tomber avec le reste
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_load:
        description: "Charge maximale (loadavg 15 min) pour jouer la démo ; 0 = pas de porte"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: qnx-demo-live
  cancel-in-progress: false

jobs:
  live:
    name: Rejouer la démo QNX et publier le résumé
    runs-on: [self-hosted, linux, x64, relais-worker]
    # Hors pull_request : la garde de 5 min ne s'applique pas (voir
    # .github/ci-budget/check_timeouts.py, qui autorise un budget explicite et
    # justifié hors PR). Un build QNX + une image + un boot + la démo demande
    # ~4 min ; on garde 15 min de marge.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Les identifiants sont conservés : ce workflow est le seul à
          # publier sur la branche `live`, et il lui faut le droit de pousser
          # (`permissions: contents: write` plus haut). Sans cela, le `git push`
          # n'a aucun moyen de s'authentifier.
          persist-credentials: true

      - name: Détecter le SDP QNX 8.0 et QEMU
        id: detect
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          SDP_ENV=""
          for candidate in "$HOME/qnx800/qnxsdp-env.sh" \
                           /opt/qnx800/qnxsdp-env.sh \
                           /usr/local/qnx/qnxsdp-env.sh; do
            if [ -f "$candidate" ]; then SDP_ENV="$candidate"; break; fi
          done
          if [ -n "$SDP_ENV" ] \
             && . "$SDP_ENV" >/dev/null 2>&1 \
             && command -v qcc >/dev/null 2>&1 \
             && command -v mkqnximage >/dev/null 2>&1 \
             && command -v qemu-system-x86_64 >/dev/null 2>&1; then
            echo "sdp=available" >> "$GITHUB_OUTPUT"
            echo "env=$SDP_ENV" >> "$GITHUB_OUTPUT"
            echo "SDP + QEMU détectés : $SDP_ENV"
          else
            echo "sdp=missing" >> "$GITHUB_OUTPUT"
            echo "SDP QNX 8.0 ou QEMU absent : la démo live est sautée"
          fi
          # KVM n'est pas un détail : en TCG l'invité ne tient pas le tick de
          # 10 ms, le mandat est révoqué et le run sort des violations. Sans
          # KVM, on ne joue pas : mieux vaut garder la dernière donnée propre.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=available" >> "$GITHUB_OUTPUT"
            echo "KVM utilisable : l'invité tiendra le tick"
          else
            echo "kvm=missing" >> "$GITHUB_OUTPUT"
            echo "KVM indisponible (/dev/kvm) : passage sauté (en TCG la démo sort des violations)"
          fi

      - name: Attendre une fenêtre calme (charge de l'hôte)
        id: quiet
        if: steps.detect.outputs.sdp == 'available' && steps.detect.outputs.kvm == 'available'
        shell: bash
        run: |
          MAX="${{ inputs.max_load || '12' }}"
          if [ "$MAX" = "0" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
            echo "porte de charge désactivée (max_load=0)"
            exit 0
          fi
          # Un hôte chargé fait arriver les ordres du nœud en retard : le
          # mandat est révoqué après p+1 manques et le verdict sort des
          # violations. On attend donc que la charge moyenne 15 min retombe.
          end=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            load15=$(cut -d' ' -f3 /proc/loadavg)
            if awk "BEGIN{exit !($load15 <= $MAX)}"; then
              echo "loadavg15=$load15" >> "$GITHUB_OUTPUT"
              echo "go=1" >> "$GITHUB_OUTPUT"
              echo "fenêtre calme : loadavg15=$load15 <= $MAX"
              exit 0
            fi
            sleep 20
          done
          echo "go=0" >> "$GITHUB_OUTPUT"
          echo "::notice::hôte encore chargé après 5 min (loadavg15=$(cut -d' ' -f3 /proc/loadavg)) : passage sauté, la dernière bonne donnée reste en ligne"

      - name: Rejouer la démo (deux machines, QNX, gel QMP)
        if: steps.detect.outputs.sdp == 'available' && steps.detect.outputs.kvm == 'available' && steps.quiet.outputs.go == '1'
        shell: bash
        run: |
          . "${{ steps.detect.outputs.env }}"
          export PATH="$HOME/.local/bin:$PATH"
          make -C target
          python3 host/bench/qnx_vm.py build
          # Le banc a une course : au réveil de l'invité (QMP `cont`), la
          # rafale des trames en attente peut faire manquer à la machine A un
          # STATUT ; A se dépose alors lui-même (invariant I4) et le verdict
          # sort quelques violations. C'est une course du banc, pas du système :
          # on rejoue donc jusqu'à 3 fois tant que le verdict n'est pas propre.
          # Seul un passage PROPRE est publié (garde plus bas).
          for attempt in 1 2 3; do
            echo "== passe $attempt/3 =="
            if make qnx-demo; then
              n=$(python3 host/bench/demo_verdict.py)
              echo "violations=$n"
              if [ "$n" = "0" ]; then
                echo "passe propre"
                break
              fi
            else
              echo "la démo a échoué"
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          ls -l docs/evidence/qnx-demo-* docs/figures/qnx-demo-proof.svg

      - name: Publier le résumé sur la branche live
        if: steps.detect.outputs.sdp == 'available' && steps.detect.outputs.kvm == 'available' && steps.quiet.outputs.go == '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, subprocess

          def lire(nom, defaut=None):
              chemin = pathlib.Path("docs/evidence") / nom
              if not chemin.is_file():
                  return defaut
              try:
                  return json.loads(chemin.read_text(encoding="utf-8"))
              except Exception:
                  return defaut

          demo = lire("qnx-demo-qnx-demo.json", {}) or {}
          qmp = lire("qnx-demo-qmp.json", []) or []
          # The evidence file carries the demo fields at its TOP level
          # (params, accel, guest_uname, takeover_us, takeover_ticks, handover,
          # journal, verdict, loadavg) — there is no "relais" wrapper, and
          # "verdict" is a STRING, not an object. Read them as they are and never
          # assume a field's type: a wrong assumption here crashes the publish
          # step after the demo has already succeeded.
          if not isinstance(demo, dict):
              demo = {}
          if not isinstance(qmp, list):
              qmp = []
          journal = demo.get("journal") if isinstance(demo.get("journal"), dict) else {}
          handover = demo.get("handover") if isinstance(demo.get("handover"), dict) else {}
          verdict = demo.get("verdict", "")
          verdict = verdict if isinstance(verdict, str) else ""
          etats = [c.get("answer", {}).get("status", "") for c in qmp
                   if isinstance(c, dict) and c.get("command") == "query-status"]
          resume = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc)
                               .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "commit": subprocess.run(["git", "rev-parse", "--short", "HEAD"],
                                       capture_output=True, text=True).stdout.strip(),
              "runner": os.environ.get("RUNNER_NAME", ""),
              "accel": demo.get("accel", ""),
              "guest_uname": demo.get("guest_uname", ""),
              "boot_seconds": demo.get("boot_seconds"),
              "takeover_us": demo.get("takeover_us"),
              "takeover_ticks": demo.get("takeover_ticks") or journal.get("takeover_ticks"),
              "handover": handover,
              "journal": journal,
              "verdict": verdict,
              "verdict_disturbed_channel": demo.get("verdict_disturbed_channel", ""),
              "qmp_statuses": [e for e in etats if e],
              "loadavg": demo.get("loadavg", []),
              "params": demo.get("params", ""),
          }
          sortie = pathlib.Path("docs/evidence/qnx-demo-live.json")
          sortie.parent.mkdir(parents=True, exist_ok=True)
          sortie.write_text(json.dumps(resume, indent=2, ensure_ascii=False) + "\n",
                            encoding="utf-8")
          # Le compte des violations vient du champ `verdict` SEUL : le fichier
          # contient aussi `verdict_disturbed_channel`, propre même quand le run
          # ne l'est pas — chercher "violations=0" dans tout le JSON déclarait un
          # run sale propre.
          m = re.search(r"violations=(\d+)", verdict)
          count = m.group(1) if m else "?"
          temp = os.environ.get("RUNNER_TEMP", ".")
          pathlib.Path(temp, "live-violations").write_text(count, encoding="utf-8")
          print(json.dumps(resume, indent=2, ensure_ascii=False)[:1200])
          PY
          # On ne publie JAMAIS un passage non propre : un invité qui ne
          # tient pas le tick (par ex. un runner sans KVM, en TCG lent)
          # produirait des violations qui remplaceraient une donnée propre
          # par une sale. La page affiche « dernier passage » : ce doit être
          # le dernier passage *valable*, sinon on garde le précédent.
          COUNT=$(cat "$RUNNER_TEMP/live-violations" 2>/dev/null || echo "?")
          if [ "$COUNT" != "0" ]; then
            echo "::warning::passage NON PROPRE (violations=$COUNT) : publication sautée, la dernière bonne donnée reste en ligne ; voir l'artefact qnx-demo-live pour ce run."
            exit 0
          fi
          # L'identité du propriétaire, comme le font déjà conflict-resolver.yml
          # et pr-auto-merge.yml : le garde pre-commit du runner refuse
          # github-actions[bot]@users.noreply.github.com (faux contributeur).
          git config user.name "BaptisteFaisy"
          git config user.email "119856854+BaptisteFaisy@users.noreply.github.com"
          # La branche `live` est un artefact de publication : chaque passage
          # repart d'une racine orpheline, donc le push est non fast-forward et
          # doit être forcé. `--force-with-lease` est exigé par la garde couche 0
          # (un push forcé nu est refusé) ; on récupère d'abord la référence de
          # suivi pour que le bail protège vraiment le passage en cours contre
          # une publication concurrente.
          git fetch --depth=1 origin live:refs/remotes/origin/live 2>/dev/null || true
          git checkout --orphan live
          git add docs/evidence/qnx-demo-live.json
          git commit -q -m "live: résumé de la dernière démo QNX"
          git push --force-with-lease origin live
          echo "publié sur la branche live"

      - name: Publier les preuves complètes (artefact)
        if: steps.detect.outputs.sdp == 'available' && steps.detect.outputs.kvm == 'available' && steps.quiet.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: qnx-demo-live
          path: |
            docs/evidence/qnx-demo-*
            docs/figures/qnx-demo-*
          if-no-files-found: error
