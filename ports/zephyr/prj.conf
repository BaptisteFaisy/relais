# Relais on Zephyr — configuration (mission M32, idea 73).
#
# What the protocol needs, and what it refuses:
#   * no heap: the core never allocates, so the pool stays at 0 and a build that
#     suddenly needs one fails instead of silently fragmenting;
#   * no time slicing: the three threads are cooperative, so a tick is never cut
#     in the middle by the kernel (the QNX image says the same thing, QNX-01);
#   * IPv4 + UDP + BSD socket names, because host/transport/udp.c is written
#     against the POSIX socket API and Zephyr provides it unchanged.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_LOOPBACK=y

# native_posix / native_sim talk to the host through a TAP interface; qemu_x86
# uses the emulated e1000. Both are enabled here so one prj.conf serves both.
CONFIG_ETH_NATIVE_POSIX=y
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_L2_ETHERNET=y

CONFIG_NUM_COOP_PRIORITIES=8
CONFIG_NUM_PREEMPT_PRIORITIES=2
CONFIG_TIMESLICING=n
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048

# Floats: the control law is float arithmetic, and the log prints values.
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_POSIX_CLOCK=y
CONFIG_POSIX_TIMERS=y
CONFIG_NET_SOCKETS_POLL=y
